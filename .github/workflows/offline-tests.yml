name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check browser script
        run: node --check web/app.js
      - name: Try the synthetic demo
        shell: python {0}
        run: |
          import csv
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as folder:
              database = Path(folder) / 'demo.sqlite3'
              output = Path(folder) / 'demo.csv'
              subprocess.run([
                  sys.executable, 'offline.py', 'demo',
                  '--db', str(database), '--output', str(output),
              ], check=True)
              subprocess.run([
                  sys.executable, 'offline.py', 'status', '--db', str(database),
              ], check=True)
              with output.open(newline='', encoding='utf-8-sig') as handle:
                  assert len(list(csv.DictReader(handle))) == 15
